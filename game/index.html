<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAVITY FLIP — a one-button neon runner</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04040e; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:"DejaVu Sans", system-ui, sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
/* GRAVITY FLIP — one button flips gravity. Dodge the shards, eat the stars. */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const params = new URLSearchParams(location.search);
const DEMO = params.get("demo") === "1";

/* deterministic rng so a filmed demo run is reproducible */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(DEMO ? 20261123 : (Date.now() % 2147483647));

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

let groundH;            // thickness of floor / ceiling bands
let orb, obstacles, stars, particles, popups;
let state;              // "title" | "play" | "over"
let score, starCount, best, speed, dist, spawnIn, shake, flashT, runTime;
let bgStars = [];

function makeBg() {
  bgStars = [];
  for (let i = 0; i < 130; i++) {
    bgStars.push({ x: rng() * W, y: rng() * H, r: rng() * 1.9 + 0.4, p: rng() * 0.5 + 0.12 });
  }
}

function reset() {
  groundH = Math.round(H * 0.115);
  orb = {
    x: W * 0.27, y: H - groundH - 30, r: Math.max(15, H * 0.027),
    vy: 0, dir: 1, grounded: true, trail: []
  };
  obstacles = [];
  stars = [];
  particles = [];
  popups = [];
  score = 0; starCount = 0; speed = 540; dist = 0; spawnIn = W * 0.55;
  shake = 0; flashT = 0; runTime = 0;
}

best = 0;
try { best = parseInt(localStorage.getItem("gravityFlipBest") || "0", 10) || 0; } catch (e) { /* private mode */ }

function saveBest() {
  if (score > best) { best = Math.floor(score); try { localStorage.setItem("gravityFlipBest", String(best)); } catch (e) {} }
}

/* ---------- spawning ---------- */
function spawnObstacle() {
  const side = rng() < 0.5 ? "floor" : "ceil";
  const hgt = H * (0.13 + rng() * 0.17);
  const wid = 54 + rng() * 66;
  obstacles.push({ x: W + 80, side, h: hgt, w: wid, hue: 315 + rng() * 30 });
  // sometimes a star arc rides just past the shard, on the safe side
  if (rng() < 0.62) {
    const safeY = side === "floor" ? groundH + 46 : H - groundH - 46;
    const n = 3 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) {
      stars.push({ x: W + 140 + i * 52, y: safeY + Math.sin(i * 0.9) * 16, r: 13, taken: false, ph: rng() * TAU });
    }
  } else if (rng() < 0.4) {
    stars.push({ x: W + 160, y: H / 2 + (rng() - 0.5) * H * 0.2, r: 13, taken: false, ph: rng() * TAU });
  }
}

/* ---------- particles & popups ---------- */
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rng() * TAU, s = (0.25 + rng() * 0.75) * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.55 + rng() * 0.5, t: 0, color, r: 2 + rng() * 3.4 });
  }
}
function popup(x, y, text, color) { popups.push({ x, y, text, color, t: 0 }); }

/* ---------- input ---------- */
function flip() {
  if (state !== "play") return;
  orb.dir *= -1;
  orb.grounded = false;
  burst(orb.x, orb.y, orb.dir === 1 ? "#59f7ff" : "#c792ff", 7, 190);
}
function press() {
  if (state === "title") { reset(); state = "play"; }
  else if (state === "over") { reset(); state = "play"; }
  else flip();
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") { e.preventDefault(); press(); }
});
canvas.addEventListener("pointerdown", press);

/* ---------- demo autopilot ---------- */
function demoThink() {
  // nearest shard still ahead of the orb
  let next = null;
  for (const o of obstacles) {
    if (o.x + o.w > orb.x - orb.r && (!next || o.x < next.x)) next = o;
  }
  if (!next) return;
  const mySide = orb.dir === 1 ? "floor" : "ceil";
  const dangerSide = next.side;
  const gap = next.x - (orb.x + orb.r);
  // falling across the corridor takes ~0.62s; flip early enough to land clear.
  // reaction window shrinks as speed climbs, so late in the run the bot errs.
  const fallTime = 0.62;
  let window_ = speed * fallTime * 1.22 - Math.max(0, speed - 860) * 0.42;
  if (mySide === dangerSide && orb.grounded && gap < window_ && gap > -10) flip();
  else if (!orb.grounded && orb.dir === (dangerSide === "floor" ? 1 : -1) && gap < speed * 0.3 && gap > 0) {
    // heading INTO the danger side mid-flight with the shard close: flip back only if far side is safe-ish
    if (gap > speed * 0.18) flip();
  }
}

/* ---------- update ---------- */
function update(dt) {
  for (const s of bgStars) { s.x -= speed * s.p * dt * (state === "play" ? 1 : 0.25); if (s.x < -4) { s.x = W + 4; s.y = rng() * H; } }
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; }
  particles = particles.filter(p => p.t < p.life);
  for (const p of popups) { p.t += dt; p.y -= 44 * dt; }
  popups = popups.filter(p => p.t < 0.9);
  if (flashT > 0) flashT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  if (state !== "play") return;
  runTime += dt;
  speed = Math.min(1180, 540 + runTime * 15.5);
  dist += speed * dt;
  score += speed * dt * 0.055;

  if (DEMO) demoThink();

  // orb physics
  const G = 4300;
  orb.vy += G * orb.dir * dt;
  orb.y += orb.vy * dt;
  const floorY = H - groundH - orb.r, ceilY = groundH + orb.r;
  if (orb.dir === 1 && orb.y >= floorY) {
    if (!orb.grounded && orb.vy > 500) burst(orb.x, H - groundH, "#59f7ff", 6, 130);
    orb.y = floorY; orb.vy = 0; orb.grounded = true;
  } else if (orb.dir === -1 && orb.y <= ceilY) {
    if (!orb.grounded && orb.vy < -500) burst(orb.x, groundH, "#c792ff", 6, 130);
    orb.y = ceilY; orb.vy = 0; orb.grounded = true;
  } else if (orb.y > floorY) { orb.y = floorY; orb.vy = 0; orb.grounded = true; }
  else if (orb.y < ceilY) { orb.y = ceilY; orb.vy = 0; orb.grounded = true; }

  orb.trail.push({ x: orb.x, y: orb.y });
  if (orb.trail.length > 16) orb.trail.shift();

  // world scroll
  spawnIn -= speed * dt;
  if (spawnIn <= 0) { spawnObstacle(); spawnIn = 470 + rng() * 240 - Math.min(120, runTime * 2.2); }
  for (const o of obstacles) o.x -= speed * dt;
  obstacles = obstacles.filter(o => o.x + o.w > -90);
  for (const s of stars) s.x -= speed * dt;
  stars = stars.filter(s => !s.taken && s.x > -40);

  // star pickup
  for (const s of stars) {
    const dx = s.x - orb.x, dy = s.y - orb.y;
    if (dx * dx + dy * dy < (s.r + orb.r + 4) * (s.r + orb.r + 4)) {
      s.taken = true; starCount++; score += 25;
      burst(s.x, s.y, "#ffd94d", 13, 240);
      popup(s.x, s.y - 24, "+25", "#ffd94d");
    }
  }

  // shard collision — shard treated as a slightly forgiving box
  for (const o of obstacles) {
    const top = o.side === "floor" ? H - groundH - o.h : groundH;
    const bot = o.side === "floor" ? H - groundH : groundH + o.h;
    const inset = 9;
    if (orb.x + orb.r - inset > o.x + 7 && orb.x - orb.r + inset < o.x + o.w - 7 &&
        orb.y + orb.r - inset > top + 6 && orb.y - orb.r + inset < bot - 2) {
      crash();
      return;
    }
  }
}

function crash() {
  state = "over";
  shake = 17; flashT = 0.32;
  burst(orb.x, orb.y, "#ff5470", 46, 430);
  burst(orb.x, orb.y, "#59f7ff", 26, 320);
  score = Math.floor(score);
  saveBest();
}

/* ---------- drawing ---------- */
function neonText(text, x, y, size, color, align, glow) {
  ctx.save();
  ctx.font = "700 " + size + "px 'DejaVu Sans', sans-serif";
  ctx.textAlign = align || "center";
  ctx.shadowColor = color; ctx.shadowBlur = glow == null ? 22 : glow;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawShard(o) {
  const base = o.side === "floor" ? H - groundH : groundH;
  const tipY = o.side === "floor" ? base - o.h : base + o.h;
  const dirS = o.side === "floor" ? -1 : 1;
  ctx.save();
  ctx.shadowColor = "hsl(" + o.hue + ",100%,62%)";
  ctx.shadowBlur = 16;
  const grad = ctx.createLinearGradient(0, base, 0, tipY);
  grad.addColorStop(0, "hsla(" + o.hue + ",95%,55%,0.92)");
  grad.addColorStop(1, "hsla(" + (o.hue + 40) + ",100%,72%,0.95)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(o.x, base);
  ctx.lineTo(o.x + o.w * 0.30, base + dirS * o.h * 0.55);
  ctx.lineTo(o.x + o.w * 0.47, tipY);
  ctx.lineTo(o.x + o.w * 0.66, base + dirS * o.h * 0.62);
  ctx.lineTo(o.x + o.w, base);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawStarShape(s, t) {
  const pulse = 1 + Math.sin(t * 4 + s.ph) * 0.13;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = "#ffd94d"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#ffd94d";
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? s.r : s.r * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5 + t * 0.7;
    ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function draw(t) {
  ctx.save();
  if (shake > 0) ctx.translate((rng() - 0.5) * shake, (rng() - 0.5) * shake);

  // backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#070722"); bg.addColorStop(0.5, "#0a1030"); bg.addColorStop(1, "#070722");
  ctx.fillStyle = bg; ctx.fillRect(-24, -24, W + 48, H + 48);
  ctx.fillStyle = "#cfe9ff";
  for (const s of bgStars) { ctx.globalAlpha = 0.35 + s.p; ctx.fillRect(s.x, s.y, s.r, s.r); }
  ctx.globalAlpha = 1;

  // corridor bands
  for (const topSide of [true, false]) {
    const y0 = topSide ? 0 : H - groundH;
    const grad = ctx.createLinearGradient(0, y0, 0, y0 + groundH);
    if (topSide) { grad.addColorStop(0, "#131a3d"); grad.addColorStop(1, "#1d2a5e"); }
    else { grad.addColorStop(0, "#1d2a5e"); grad.addColorStop(1, "#131a3d"); }
    ctx.fillStyle = grad; ctx.fillRect(-24, y0, W + 48, groundH);
    ctx.save();
    ctx.strokeStyle = "rgba(89,247,255,0.5)"; ctx.lineWidth = 2;
    ctx.shadowColor = "#59f7ff"; ctx.shadowBlur = 9;
    ctx.beginPath();
    const ly = topSide ? groundH : H - groundH;
    ctx.moveTo(-24, ly); ctx.lineTo(W + 24, ly); ctx.stroke();
    // scrolling ticks on the band edge
    ctx.strokeStyle = "rgba(89,247,255,0.20)";
    const off = (dist * 1.0) % 90;
    for (let x = -off; x < W + 90; x += 90) {
      ctx.beginPath(); ctx.moveTo(x, ly); ctx.lineTo(x + (topSide ? -26 : 26) * 0 + 0, ly + (topSide ? 14 : -14)); ctx.stroke();
    }
    ctx.restore();
  }

  for (const s of stars) drawStarShape(s, t);
  for (const o of obstacles) drawShard(o);

  // orb trail
  for (let i = 0; i < orb.trail.length; i++) {
    const p = orb.trail[i], f = i / orb.trail.length;
    ctx.save();
    ctx.globalAlpha = f * 0.30;
    ctx.fillStyle = orb.dir === 1 ? "#59f7ff" : "#c792ff";
    ctx.beginPath(); ctx.arc(p.x, p.y, orb.r * f, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // orb
  if (state !== "over") {
    ctx.save();
    ctx.shadowColor = orb.dir === 1 ? "#59f7ff" : "#c792ff";
    ctx.shadowBlur = 30;
    const og = ctx.createRadialGradient(orb.x - orb.r * 0.35, orb.y - orb.r * 0.35, 2, orb.x, orb.y, orb.r);
    og.addColorStop(0, "#ffffff");
    og.addColorStop(0.45, orb.dir === 1 ? "#8ffaff" : "#e2c6ff");
    og.addColorStop(1, orb.dir === 1 ? "#0e9bb5" : "#7a3fd1");
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.r, 0, TAU); ctx.fill();
    ctx.restore();
    // gravity arrow hint
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    const ax = orb.x, ay = orb.y + orb.dir * (orb.r + 15);
    ctx.beginPath();
    ctx.moveTo(ax - 7, ay - orb.dir * 6); ctx.lineTo(ax + 7, ay - orb.dir * 6); ctx.lineTo(ax, ay + orb.dir * 7);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    ctx.restore();
  }
  for (const p of popups) {
    ctx.save();
    ctx.globalAlpha = 1 - p.t / 0.9;
    ctx.font = "700 25px 'DejaVu Sans', sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = p.color; ctx.shadowBlur = 12;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }

  if (flashT > 0) { ctx.fillStyle = "rgba(255,60,90," + (flashT * 0.55) + ")"; ctx.fillRect(-24, -24, W + 48, H + 48); }

  // HUD
  if (state !== "title") {
    neonText(String(Math.floor(score)), 42, 66, 46, "#ffffff", "left", 14);
    neonText("★ " + starCount, 44, 108, 27, "#ffd94d", "left", 12);
    neonText("SPEED ×" + (speed / 540).toFixed(2), W - 42, 66, 27, "#59f7ff", "right", 12);
    neonText("BEST " + best, W - 42, 104, 22, "rgba(230,240,255,0.8)", "right", 6);
  }

  if (state === "title") {
    neonText("GRAVITY FLIP", W / 2, H * 0.40, Math.min(96, W * 0.062), "#59f7ff");
    neonText("one button · flip gravity · dodge the shards · eat the stars", W / 2, H * 0.40 + 58, 27, "#e8f6ff");
    const blink = Math.sin(t * 3.2) > -0.25;
    if (blink) neonText(DEMO ? "DEMO MODE" : "PRESS SPACE OR CLICK TO RUN", W / 2, H * 0.66, 30, "#ffd94d");
    neonText("the corridor only gets faster…", W / 2, H * 0.66 + 44, 21, "rgba(220,235,255,0.65)");
  }
  if (state === "over") {
    ctx.fillStyle = "rgba(3,3,16,0.45)"; ctx.fillRect(-24, -24, W + 48, H + 48);
    neonText("WRECKED!", W / 2, H * 0.40, 84, "#ff5470");
    neonText("SCORE  " + Math.floor(score), W / 2, H * 0.40 + 76, 42, "#ffffff");
    neonText("★ " + starCount + " stars      BEST  " + best, W / 2, H * 0.40 + 122, 27, "#ffd94d");
    const blink = Math.sin(t * 3.2) > -0.25;
    if (blink && !DEMO) neonText("PRESS SPACE TO RUN AGAIN", W / 2, H * 0.68, 27, "#59f7ff");
  }
  ctx.restore();
}

/* ---------- main loop ---------- */
reset();
makeBg();
state = "title";
if (DEMO) {
  setTimeout(() => { if (state === "title") { reset(); state = "play"; } }, 900);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* hooks for the filming script */
window.__gf = {
  get state() { return state; },
  get score() { return Math.floor(score); },
  get stars() { return starCount; },
  get runTime() { return runTime; }
};
</script>
</body>
</html>
